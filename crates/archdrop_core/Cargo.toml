pem = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
x509-parser = { workspace = true }
rustls-pki-types = { workspace = true }
# SQLite Event Ledger (Phase 3 Milestone 2)
rusqlite = { version = "0.32", features = ["bundled"] }


[dev-dependencies]
tempfile = "3.17"

